name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate assets and build
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PICKFORGE_ALI_LINK_API: ${{ vars.PICKFORGE_ALI_LINK_API }}
        run: |
          python generate_assets.py
          OWNER_LC="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          if [ "$REPO_LC" = "${OWNER_LC}.github.io" ]; then
            SITE_URL="https://${OWNER}.github.io/"
          else
            SITE_URL="https://${OWNER}.github.io/${REPO}/"
          fi
          if [ -n "$PICKFORGE_ALI_LINK_API" ]; then
            python build.py "$SITE_URL" "$PICKFORGE_ALI_LINK_API"
          else
            python build.py "$SITE_URL"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
